services:
  secret-dj:
    build: .
    container_name: secret-dj
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      # Same-origin by default: this container serves both the API and the app.
      # Set to a comma-separated origin list if you host the frontend elsewhere.
      # CORS_ORIGIN: https://secretdj.example.com
      # Number of proxy hops in front of the app, for correct per-IP rate limits.
      TRUST_PROXY_HOPS: 1
